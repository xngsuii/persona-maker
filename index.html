<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona Receipt</title>
  <meta name="description" content="AI 채팅용 랜덤 페르소나 메이커">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('pr-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark'; // 기본은 다크 모드
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- Pretendard (사이트 기본) / 움돋12 (영수증) — 둘 다 SIL OFL 1.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/umdot-font@main/umdot.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">PERSONA RECEIPT</span>
      <span class="brand-sub">랜덤 페르소나 메이커</span>
    </div>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="라이트/다크 모드 전환">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="layout">
    <aside class="panel">
      <form id="options" class="options" autocomplete="off">
        <fieldset class="field">
          <legend>성별</legend>
          <div class="segmented">
            <label><input type="radio" name="gender" value="random" checked><span>랜덤</span></label>
            <label><input type="radio" name="gender" value="female"><span>여성</span></label>
            <label><input type="radio" name="gender" value="male"><span>남성</span></label>
            <label><input type="radio" name="gender" value="nonbinary"><span>논바이너리</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>국적 · 혈통</legend>
          <div class="select-row">
            <select id="nation" class="select" aria-label="국적">
              <option value="random">국적 랜덤</option>
            </select>
            <select id="blood" class="select" aria-label="혈통">
              <option value="random">혈통 랜덤</option>
              <option value="single">단일</option>
              <option value="mixed">혼혈</option>
              <option value="heritage">OO계</option>
            </select>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>나이 범위 <span class="legend-sub">성인만 · 20–60세</span></legend>
          <div class="range-row">
            <input id="ageMin" class="num" type="number" min="20" max="60" value="20" inputmode="numeric" aria-label="최소 나이">
            <span>~</span>
            <input id="ageMax" class="num" type="number" min="20" max="60" value="35" inputmode="numeric" aria-label="최대 나이">
            <span class="muted">세</span>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>키 범위 <span class="legend-sub">비우면 성별 기준</span></legend>
          <div class="range-row">
            <input id="heightMin" class="num" type="number" min="140" max="210" placeholder="자동" inputmode="numeric" aria-label="최소 키">
            <span>~</span>
            <input id="heightMax" class="num" type="number" min="140" max="210" placeholder="자동" inputmode="numeric" aria-label="최대 키">
            <span class="muted">cm</span>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>옵션</legend>
          <label class="check"><input id="optFantasy" type="checkbox" checked><span>판타지 머리색 · 눈동자색 포함</span></label>
          <label class="check"><input id="optPatronymic" type="checkbox" checked><span>러시아 이름에 부칭 포함</span></label>
          <label class="check"><input id="optPrompt" type="checkbox"><span>이미지 생성 프롬프트 함께 만들기</span></label>
          <p class="hint">생성 후에 켜면 페르소나는 그대로 두고 프롬프트만 만들어요.</p>
        </fieldset>

        <div class="field" role="group" aria-labelledby="pickTitle">
          <div class="field-head">
            <span id="pickTitle" class="field-label">포함할 항목</span>
            <button id="pickReset" class="btn-mini" type="button" title="NSFW만 빼고 전부 선택">기본값</button>
          </div>
          <div id="itemPicker" class="picker"></div>
          <div class="pick-actions">
            <button id="pickAll" class="btn btn-small" type="button">전체 선택</button>
            <button id="pickNone" class="btn btn-small" type="button">전체 해제</button>
          </div>
        </div>

        <button id="generate" class="btn btn-primary btn-block" type="submit">페르소나 생성</button>
      </form>
    </aside>

    <section class="stage">
      <p class="stage-hint">영수증의 항목을 클릭하면 그 항목만 다시 뽑아요.</p>

      <div class="receipt-holder">
        <div id="receipt" class="receipt"></div>
      </div>

      <div class="actions">
        <button id="copyMd" class="btn btn-primary" type="button" disabled>마크다운 복사하기</button>
        <button id="saveImg" class="btn" type="button" disabled>이미지로 저장</button>
      </div>

      <section id="promptCard" class="card prompt-card" hidden>
        <div class="card-head">
          <div>
            <h2 class="card-title">이미지 생성 프롬프트</h2>
            <p class="hint">NovelAI 태그 형식 · 외형은 페르소나를 따르고 표정만 따로 다시 뽑을 수 있어요</p>
          </div>
          <button id="rerollPrompt" class="btn btn-small" type="button">표정 재생성</button>
        </div>
        <div id="promptBody" class="prompt-body"></div>
        <button id="copyPrompt" class="btn btn-primary btn-block" type="button">프롬프트 복사하기</button>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
